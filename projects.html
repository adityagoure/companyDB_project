<main class="main">
  <div class="topbar">
    <div class="topbar-title">Projects</div>
    <div class="topbar-actions">
      <button class="btn btn-primary" onclick="openModal()">+ Add Project</button>
    </div>
  </div>
  <div class="content">
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Proj No</th><th>Project Name</th><th>Location</th><th>Department</th><th>Assigned Employees</th><th>Actions</th></tr>
        </thead>
        <tbody id="proj-table">
          <tr><td colspan="6"><div class="empty"><div class="empty-icon">⏳</div><p>Loading...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">Add Project</div>
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="form-grid">
      <input type="hidden" id="f-mode" value="add"/>
      <div class="form-group">
        <label>Project Number</label>
        <input type="number" id="f-number" placeholder="10"/>
      </div>
      <div class="form-group">
        <label>Project Name</label>
        <input type="text" id="f-name" placeholder="ProductX"/>
      </div>
      <div class="form-group">
        <label>Location</label>
        <input type="text" id="f-location" placeholder="Bellaire"/>
      </div>
      <div class="form-group">
        <label>Department</label>
        <select id="f-dept"></select>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveProject()">Save Project</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = 'api/projects.php';
const DEPT_API = 'api/departments.php';

async function loadDepts() {
  const res = await fetch(DEPT_API + '?action=get_all');
  const depts = await res.json();
  document.getElementById('f-dept').innerHTML = depts.map(d => `<option value="${d.dept_number}">${d.dept_name}</option>`).join('');
}

async function loadProjects() {
  const res = await fetch(API + '?action=get_all');
  const data = await res.json();
  const tbody = document.getElementById('proj-table');
  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty"><div class="empty-icon">📭</div><p>No projects found</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = data.map(p => `
    <tr>
      <td><span class="badge badge-purple">#${p.proj_number}</span></td>
      <td><strong>${p.proj_name}</strong></td>
      <td>${p.location || '—'}</td>
      <td>${p.dept_name || '—'}</td>
      <td><span class="badge badge-green">${p.total_employees} employees</span></td>
      <td style="display:flex;gap:8px">
        <button class="btn btn-edit btn-sm" onclick='editProject(${JSON.stringify(p)})'>Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteProject('${p.proj_number}')">Delete</button>
      </td>
    </tr>
  `).join('');
}

function openModal() {
  document.getElementById('modal-title').textContent = 'Add Project';
  document.getElementById('f-mode').value = 'add';
  document.getElementById('f-number').value = '';
  document.getElementById('f-number').disabled = false;
  document.getElementById('f-name').value = '';
  document.getElementById('f-location').value = '';
  document.getElementById('modal').classList.add('open');
}

function editProject(p) {
  document.getElementById('modal-title').textContent = 'Edit Project';
  document.getElementById('f-mode').value = 'edit';
  document.getElementById('f-number').value = p.proj_number;
  document.getElementById('f-number').disabled = true;
  document.getElementById('f-name').value = p.proj_name;
  document.getElementById('f-location').value = p.location || '';
  document.getElementById('f-dept').value = p.dept_number || '';
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

async function saveProject() {
  const mode = document.getElementById('f-mode').value;
  const fd = new FormData();
  fd.append('proj_number', document.getElementById('f-number').value);
  fd.append('proj_name',   document.getElementById('f-name').value);
  fd.append('location',    document.getElementById('f-location').value);
  fd.append('dept_number', document.getElementById('f-dept').value);

  // Validate on client side
  if (!document.getElementById('f-number').value || !document.getElementById('f-name').value) {
    showToast('❌ Project number and name are required.', 'error');
    return;
  }

  const action = mode === 'add' ? 'add' : 'update';
  try {
    const res = await fetch(API + '?action=' + action, { method: 'POST', body: fd });
    const text = await res.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      showToast('❌ Server error. Please try again.', 'error');
      console.error('Non-JSON response:', text);
      return;
    }
    closeModal();
    showToast(data.status === 'success' ? '✅ ' + data.message : '❌ ' + data.message, data.status);
    loadProjects();
  } catch (e) {
    showToast('❌ Network error. Please check your connection.', 'error');
    console.error('Fetch error:', e);
  }
}

async function deleteProject(num) {
  if (!confirm('Delete this project?')) return;
  try {
    const res = await fetch(API + '?action=delete&proj_number=' + num);
    const text = await res.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      showToast('❌ Server error. Please try again.', 'error');
      console.error('Non-JSON response:', text);
      return;
    }
    showToast(data.status === 'success' ? '✅ ' + data.message : '❌ ' + data.message, data.status);
    loadProjects();
  } catch (e) {
    showToast('❌ Network error. Please check your connection.', 'error');
    console.error('Fetch error:', e);
  }
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  setTimeout(() => t.className = 'toast', 3000);
}

loadDepts();
loadProjects();
</script>
</body>
</html>
