<main class="main">
  <div class="topbar">
    <div class="topbar-title">Employees</div>
    <div class="topbar-actions">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="search" placeholder="Search employees..." oninput="filterTable()"/>
      </div>
      <button class="btn btn-primary" onclick="openModal()">+ Add Employee</button>
    </div>
  </div>

  <div class="content">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>SSN</th>
            <th>Birth Date</th>
            <th>Sex</th>
            <th>Salary</th>
            <th>Department</th>
            <th>Supervisor</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="emp-table">
          <tr><td colspan="8"><div class="empty"><div class="empty-icon">⏳</div><p>Loading employees...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">Add Employee</div>
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="form-grid">
      <input type="hidden" id="f-mode" value="add"/>
      <div class="form-group">
        <label>First Name</label>
        <input type="text" id="f-fname" placeholder="John"/>
      </div>
      <div class="form-group">
        <label>Middle Initial</label>
        <input type="text" id="f-minit" placeholder="B" maxlength="1"/>
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" id="f-lname" placeholder="Smith"/>
      </div>
      <div class="form-group">
        <label>SSN</label>
        <input type="text" id="f-ssn" placeholder="123456789" maxlength="9"/>
      </div>
      <div class="form-group">
        <label>Birth Date</label>
        <input type="date" id="f-bdate"/>
      </div>
      <div class="form-group">
        <label>Sex</label>
        <select id="f-sex">
          <option value="M">Male</option>
          <option value="F">Female</option>
        </select>
      </div>
      <div class="form-group">
        <label>Salary</label>
        <input type="number" id="f-salary" placeholder="30000"/>
      </div>
      <div class="form-group">
        <label>Department</label>
        <select id="f-dept"></select>
      </div>
      <div class="form-group full">
        <label>Address</label>
        <input type="text" id="f-address" placeholder="731 Fondren, Houston TX"/>
      </div>
      <div class="form-group full">
        <label>Supervisor SSN (optional)</label>
        <input type="text" id="f-supervisor" placeholder="888665555"/>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEmployee()">Save Employee</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const API = 'api/employees.php';
const DEPT_API = 'api/departments.php';
let allEmployees = [];

async function loadEmployees() {
  const res = await fetch(API + '?action=get_all');
  allEmployees = await res.json();
  renderTable(allEmployees);
}

function renderTable(data) {
  const tbody = document.getElementById('emp-table');
  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="8"><div class="empty"><div class="empty-icon">📭</div><p>No employees found</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = data.map(e => `
    <tr>
      <td><strong>${e.fname} ${e.minit ? e.minit+'.' : ''} ${e.lname}</strong></td>
      <td><span class="badge badge-purple">${e.ssn}</span></td>
      <td>${e.bdate || '—'}</td>
      <td>${e.sex === 'M' ? '♂ Male' : '♀ Female'}</td>
      <td><span class="badge badge-green">$${Number(e.salary).toLocaleString()}</span></td>
      <td>${e.dept_name || '—'}</td>
      <td>${e.supervisor_ssn || '—'}</td>
      <td style="display:flex;gap:8px">
        <button class="btn btn-edit btn-sm" onclick='editEmployee(${JSON.stringify(e)})'>Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteEmployee('${e.ssn}')">Delete</button>
      </td>
    </tr>
  `).join('');
}

function filterTable() {
  const q = document.getElementById('search').value.toLowerCase();
  renderTable(allEmployees.filter(e =>
    (e.fname+' '+e.lname).toLowerCase().includes(q) ||
    e.ssn.includes(q) ||
    (e.dept_name || '').toLowerCase().includes(q)
  ));
}

async function loadDepts() {
  const res = await fetch(DEPT_API + '?action=get_all');
  const depts = await res.json();
  const sel = document.getElementById('f-dept');
  sel.innerHTML = depts.map(d => `<option value="${d.dept_number}">${d.dept_name}</option>`).join('');
}

function openModal() {
  document.getElementById('modal-title').textContent = 'Add Employee';
  document.getElementById('f-mode').value = 'add';
  ['fname','minit','lname','ssn','address','supervisor'].forEach(f => document.getElementById('f-'+f).value = '');
  document.getElementById('f-bdate').value = '';
  document.getElementById('f-salary').value = '';
  document.getElementById('f-ssn').disabled = false;
  document.getElementById('modal').classList.add('open');
}

function editEmployee(e) {
  document.getElementById('modal-title').textContent = 'Edit Employee';
  document.getElementById('f-mode').value = 'edit';
  document.getElementById('f-fname').value = e.fname;
  document.getElementById('f-minit').value = e.minit || '';
  document.getElementById('f-lname').value = e.lname;
  document.getElementById('f-ssn').value = e.ssn;
  document.getElementById('f-ssn').disabled = true;
  document.getElementById('f-bdate').value = e.bdate || '';
  document.getElementById('f-sex').value = e.sex || 'M';
  document.getElementById('f-salary').value = e.salary;
  document.getElementById('f-address').value = e.address || '';
  document.getElementById('f-supervisor').value = e.supervisor_ssn || '';
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

async function saveEmployee() {
  const mode = document.getElementById('f-mode').value;
  const fd = new FormData();
  fd.append('ssn',          document.getElementById('f-ssn').value);
  fd.append('fname',        document.getElementById('f-fname').value);
  fd.append('minit',        document.getElementById('f-minit').value);
  fd.append('lname',        document.getElementById('f-lname').value);
  fd.append('bdate',        document.getElementById('f-bdate').value);
  fd.append('sex',          document.getElementById('f-sex').value);
  fd.append('salary',       document.getElementById('f-salary').value);
  fd.append('address',      document.getElementById('f-address').value);
  fd.append('dept_number',  document.getElementById('f-dept').value);
  fd.append('supervisor_ssn', document.getElementById('f-supervisor').value);

  const action = mode === 'add' ? 'add' : 'update';
  const res = await fetch(API + '?action=' + action, { method: 'POST', body: fd });
  const data = await res.json();
  closeModal();
  showToast(data.status === 'success' ? '✅ ' + data.message : '❌ ' + data.message, data.status);
  loadEmployees();
}

async function deleteEmployee(ssn) {
  if (!confirm('Delete this employee?')) return;
  const res = await fetch(API + '?action=delete&ssn=' + ssn);
  const data = await res.json();
  showToast(data.status === 'success' ? '✅ ' + data.message : '❌ ' + data.message, data.status);
  loadEmployees();
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  setTimeout(() => t.className = 'toast', 3000);
}

loadDepts();
loadEmployees();
</script>
</body>
