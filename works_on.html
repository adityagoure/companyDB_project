<main class="main">
  <div class="topbar">
    <div class="topbar-title">Assignments</div>
    <div class="topbar-actions">
      <button class="btn btn-primary" onclick="openModal()">+ Assign Employee</button>
    </div>
  </div>
  <div class="content">
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Employee</th><th>SSN</th><th>Project</th><th>Hours / Week</th><th>Actions</th></tr>
        </thead>
        <tbody id="works-table">
          <tr><td colspan="5"><div class="empty"><div class="empty-icon">⏳</div><p>Loading...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title">Assign Employee to Project</div>
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="form-grid">
      <div class="form-group full">
        <label>Employee</label>
        <select id="f-emp"></select>
      </div>
      <div class="form-group full">
        <label>Project</label>
        <select id="f-proj"></select>
      </div>
      <div class="form-group full">
        <label>Hours Per Week</label>
        <input type="number" id="f-hours" placeholder="32.5" step="0.5"/>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveAssignment()">Save Assignment</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API      = 'api/works_on.php';
const EMP_API  = 'api/employees.php';
const PROJ_API = 'api/projects.php';

async function loadDropdowns() {
  const [emps, projs] = await Promise.all([
    fetch(EMP_API + '?action=get_all').then(r => r.json()),
    fetch(PROJ_API + '?action=get_all').then(r => r.json())
  ]);
  document.getElementById('f-emp').innerHTML  = emps.map(e  => `<option value="${e.ssn}">${e.fname} ${e.lname} (${e.ssn})</option>`).join('');
  document.getElementById('f-proj').innerHTML = projs.map(p => `<option value="${p.proj_number}">${p.proj_name}</option>`).join('');
}

async function loadAssignments() {
  const res = await fetch(API + '?action=get_all');
  const data = await res.json();
  const tbody = document.getElementById('works-table');
  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="5"><div class="empty"><div class="empty-icon">📭</div><p>No assignments found</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = data.map(w => `
    <tr>
      <td><strong>${w.fname} ${w.lname}</strong></td>
      <td><span class="badge badge-purple">${w.emp_ssn}</span></td>
      <td><span class="badge badge-pink">${w.proj_name}</span></td>
      <td><span class="badge badge-green">${w.hours} hrs</span></td>
      <td>
        <button class="btn btn-danger btn-sm" onclick="deleteAssignment('${w.emp_ssn}','${w.proj_number}')">Remove</button>
      </td>
    </tr>
  `).join('');
}

function openModal() {
  document.getElementById('f-hours').value = '';
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

async function saveAssignment() {
  const fd = new FormData();
  fd.append('emp_ssn',     document.getElementById('f-emp').value);
  fd.append('proj_number', document.getElementById('f-proj').value);
  fd.append('hours',       document.getElementById('f-hours').value);
  const res = await fetch(API + '?action=add', { method: 'POST', body: fd });
  const data = await res.json();
  closeModal();
  showToast(data.status === 'success' ? '✅ ' + data.message : '❌ ' + data.message, data.status);
  loadAssignments();
}

async function deleteAssignment(ssn, proj) {
  if (!confirm('Remove this assignment?')) return;
  const res = await fetch(`${API}?action=delete&emp_ssn=${ssn}&proj_number=${proj}`);
  const data = await res.json();
  showToast(data.status === 'success' ? '✅ ' + data.message : '❌ ' + data.message, data.status);
  loadAssignments();
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  setTimeout(() => t.className = 'toast', 3000);
}

loadDropdowns();
loadAssignments();
</script>
</body>
</html>
