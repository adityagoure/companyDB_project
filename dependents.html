<main class="main">
  <div class="topbar">
    <div class="topbar-title">Dependents</div>
    <div class="topbar-actions">
      <button class="btn btn-primary" onclick="openModal()">+ Add Dependent</button>
    </div>
  </div>
  <div class="content">
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Dependent Name</th><th>Employee</th><th>Relationship</th><th>Sex</th><th>Birth Date</th><th>Actions</th></tr>
        </thead>
        <tbody id="dep-table">
          <tr><td colspan="6"><div class="empty"><div class="empty-icon">⏳</div><p>Loading...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title">Add Dependent</div>
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="form-grid">
      <div class="form-group full">
        <label>Employee</label>
        <select id="f-emp"></select>
      </div>
      <div class="form-group">
        <label>Dependent Name</label>
        <input type="text" id="f-name" placeholder="Alice"/>
      </div>
      <div class="form-group">
        <label>Relationship</label>
        <select id="f-rel">
          <option value="Daughter">Daughter</option>
          <option value="Son">Son</option>
          <option value="Spouse">Spouse</option>
          <option value="Parent">Parent</option>
          <option value="Sibling">Sibling</option>
        </select>
      </div>
      <div class="form-group">
        <label>Sex</label>
        <select id="f-sex">
          <option value="M">Male</option>
          <option value="F">Female</option>
        </select>
      </div>
      <div class="form-group">
        <label>Birth Date</label>
        <input type="date" id="f-bdate"/>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveDependent()">Save Dependent</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API     = 'api/dependents.php';
const EMP_API = 'api/employees.php';

async function loadEmployees() {
  const res = await fetch(EMP_API + '?action=get_all');
  const emps = await res.json();
  document.getElementById('f-emp').innerHTML = emps.map(e => `<option value="${e.ssn}">${e.fname} ${e.lname} (${e.ssn})</option>`).join('');
}

async function loadDependents() {
  const res = await fetch(API + '?action=get_all');
  const data = await res.json();
  const tbody = document.getElementById('dep-table');
  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty"><div class="empty-icon">📭</div><p>No dependents found</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = data.map(d => `
    <tr>
      <td><strong>${d.dep_name}</strong></td>
      <td>${d.fname} ${d.lname}</td>
      <td><span class="badge badge-pink">${d.relationship}</span></td>
      <td>${d.sex === 'M' ? '♂ Male' : '♀ Female'}</td>
      <td>${d.birth_date || '—'}</td>
      <td>
        <button class="btn btn-danger btn-sm" onclick="deleteDependent('${d.emp_ssn}','${d.dep_name}')">Delete</button>
      </td>
    </tr>
  `).join('');
}

function openModal() {
  document.getElementById('f-name').value = '';
  document.getElementById('f-bdate').value = '';
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

async function saveDependent() {
  const fd = new FormData();
  fd.append('emp_ssn',      document.getElementById('f-emp').value);
  fd.append('dep_name',     document.getElementById('f-name').value);
  fd.append('sex',          document.getElementById('f-sex').value);
  fd.append('birth_date',   document.getElementById('f-bdate').value);
  fd.append('relationship', document.getElementById('f-rel').value);
  const res = await fetch(API + '?action=add', { method: 'POST', body: fd });
  const data = await res.json();
  closeModal();
  showToast(data.status === 'success' ? '✅ ' + data.message : '❌ ' + data.message, data.status);
  loadDependents();
}

async function deleteDependent(ssn, name) {
  if (!confirm('Delete this dependent?')) return;
  const res = await fetch(`${API}?action=delete&emp_ssn=${ssn}&dep_name=${encodeURIComponent(name)}`);
  const data = await res.json();
  showToast(data.status === 'success' ? '✅ ' + data.message : '❌ ' + data.message, data.status);
  loadDependents();
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  setTimeout(() => t.className = 'toast', 3000);
}

loadEmployees();
loadDependents();
</script>
</body>
</html>
